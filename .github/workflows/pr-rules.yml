name: pr-rules

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  pr-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Linked issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const query = `query($owner: String!, $repo: String!, $n: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $n) {
                  closingIssuesReferences(first: 1) { totalCount }
                }
              }
            }`;
            const result = await github.graphql(query, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              n: pr.number,
            });
            const linked = result.repository.pullRequest
              .closingIssuesReferences.totalCount;
            const keyword = /\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\s+#\d+/i;
            if (linked === 0 && !keyword.test(pr.body ?? "")) {
              core.setFailed(
                "No linked issue. Open an issue first and write " +
                  "'Closes #N' in the PR description.",
              );
            }

      - name: Size
        uses: actions/github-script@v7
        env:
          MAX_LINES: "400"
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = pr.labels.map((label) => label.name);
            if (labels.includes("size-exception")) {
              core.notice("Label size-exception: size check skipped.");
              return;
            }
            const ignored = [
              /(^|\/)package-lock\.json$/,
              /(^|\/)vendor\//,
              /^dist\//,
            ];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const counted = files.filter(
              (file) => !ignored.some((rule) => rule.test(file.filename)),
            );
            const changed = counted.reduce(
              (sum, file) => sum + file.additions + file.deletions,
              0,
            );
            const max = Number(process.env.MAX_LINES);
            core.info(`Changed lines: ${changed} (limit ${max}).`);
            if (changed > max) {
              core.setFailed(
                `PR changes ${changed} lines, the limit is ${max}. ` +
                  "Split the issue into smaller sub-issues and PRs.",
              );
            }
